; LUMI Pocket - firmware prototypu
; Środowiska:
;   proto  - prototyp z jednego sklepu: modem SIMCom A7670E (KAmod), ekran 2,4" ILI9341
;   series - wersja docelowa: modem Quectel EG915U-EU, ekran 2,8" IPS ST7789
;   allegro - prototyp z koszyka Allegro: SIM800L (2G), ekran 2,8" ST7789, bez DAC/FM -
;             dźwięk tylko z głośnika modemu (patrz docs/prototyp-allegro.md)
;   native - testy logiki na komputerze (pio test -e native)
; Warstwa rozmów sama rozpoznaje modem (ATI), więc oba środowiska różnią się tylko ekranem i pinami.

[platformio]
default_envs = allegro

[esp32s3_base]
build_src_filter = +<*> -<audio/AudioModem.cpp>
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    -DCORE_DEBUG_LEVEL=2
    ; adres aplikacji rodziny (np. https://lumi-twoja.vercel.app); można też podać na stronie 192.168.4.1
    -DLUMI_SERVER=\"\"
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
    esphome/ESP32-audioI2S@2.0.7
    pu2clr/PU2CLR RDA5807@^1.1.9

[env:proto]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DLUMI_PANEL_ILI9341
    -DLUMI_VARIANT=\"proto\"

[env:series]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DLUMI_PANEL_ST7789
    -DLUMI_VARIANT=\"series\"

[env:allegro]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DLUMI_PANEL_ST7789
    -DLUMI_PANEL_INVERT=0
    -DLUMI_MODEM_RESET_ONLY
    -DLUMI_AUDIO_MODEM
    -DLUMI_VARIANT=\"allegro\"
build_src_filter = +<*> -<audio/AudioOut.cpp>
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0

[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -DLUMI_NATIVE
build_src_filter = -<*> +<core/>
lib_deps = bblanchon/ArduinoJson@^7.2.0
test_build_src = yes
