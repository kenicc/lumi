# Sprawdzenie przy każdej zmianie: firmware (testy, 3 warianty, symulator ekranu) i aplikacja rodziny.
name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Testy logiki (w tym kontrakt z aplikacją)
        run: pio test -e native
      - name: Budowa wariantów
        run: |
          pio run -e allegro
          pio run -e proto
          pio run -e series

  simulator:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio pillow
      - run: cd firmware && pio pkg install -e proto
      - run: cd app && npm ci
      - name: Zrzuty ekranów LUMI
        run: firmware/sim/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ekrany-lumi
          path: firmware/sim/out/*.png

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Testy klikania (E2E, tryb demo)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
